[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.default.fuzz]
runs = 64

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "params_first"
quote_style = "double"
tab_width = 4

# Robinhood Chain
# mainnet chainId 4663 — https://rpc.mainnet.chain.robinhood.com
# testnet chainId 46630 — https://rpc.testnet.chain.robinhood.com
[rpc_endpoints]
robinhood = "${RH_RPC_URL}"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "${BLOCKSCOUT_KEY}", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
robinhood_testnet = { key = "${BLOCKSCOUT_KEY}", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
